<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- FIX: maximum-scale=1.0 / user-scalable=no kaldırıldı — kullanıcı zoom yapabilmeli -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Box</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Karşılama Ekranı -->
    <div id="welcome-screen" class="active" aria-hidden="false">
        <div class="welcome-content">
            <h1 class="serif-title welcome-title">OUR MEMORY BOX</h1>
            <p class="subtitle">A little place for everything<br>I don't want to forget.</p>
            <p class="date-range">2025 — 2026</p>
            <button id="open-box-btn" aria-label="Kutuyu Aç">OPEN THE BOX</button>
        </div>
    </div>

    <!-- Ana İçerik -->
    <main id="main-content" class="hidden" aria-hidden="true">

        <header>
            <div class="music-player">
                <button id="music-toggle" aria-label="Müziği Başlat">
                    <span id="music-icon">▶</span> <span class="music-text">Our Song</span>
                </button>
                <audio id="bg-music" loop preload="none">
                    <source src="assets/music/our-song.mp3" type="audio/mpeg">
                </audio>
            </div>

            <nav id="main-nav" aria-label="Ana Menü">
                <button class="nav-btn active" data-target="photos">PHOTOS</button>
                <button class="nav-btn" data-target="places">PLACES</button>
                <button class="nav-btn" data-target="timeline">TIMELINE</button>
                <button class="nav-btn" data-target="memories">LITTLE MEMORIES</button>
                <button class="nav-btn" data-target="letter">LETTER</button>
            </nav>
        </header>

        <div class="content-container">

            <section id="photos" class="section active">
                <h2 class="serif-title section-title fade-in-on-scroll">Captured Moments</h2>
                <div class="photo-grid" id="photo-container"></div>
            </section>

            <section id="places" class="section">
                <h2 class="serif-title section-title fade-in-on-scroll">Where We've Been</h2>
                <div class="places-container" id="places-container"></div>
            </section>

            <section id="timeline" class="section">
                <h2 class="serif-title section-title fade-in-on-scroll">Our Story</h2>
                <div class="timeline-container" id="timeline-container"></div>
            </section>

            <section id="memories" class="section">
                <h2 class="serif-title section-title fade-in-on-scroll">Little Things</h2>
                <div class="memories-grid" id="memories-container"></div>
            </section>

            <section id="letter" class="section">
                <div class="letter-container fade-in-on-scroll">
                    <!-- FIX: tabindex/role/aria-label eklendi — klavye ile açılabilir -->
                    <div class="envelope-wrapper" id="envelope-wrapper"
                         tabindex="0" role="button" aria-label="Mektubu açmak için tıklayın">
                        <div class="envelope">
                            <div class="envelope-flap"></div>
                            <div class="envelope-body">
                                <span class="envelope-text serif-title">For You</span>
                            </div>
                        </div>
                    </div>
                    <!-- FIX: tabindex="-1" eklendi — programatik focus için -->
                    <div class="letter-content hidden" id="letter-content" tabindex="-1"></div>
                </div>
            </section>

        </div>
    </main>

    <!-- Fotoğraf Lightbox -->
    <!-- FIX: aria-modal + aria-labelledby eklendi -->
    <div id="lightbox" class="hidden" aria-hidden="true"
         role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
        <div class="lightbox-overlay"></div>
        <div class="lightbox-content">
            <button class="close-lightbox" aria-label="Kapat">&times;</button>
            <div class="lightbox-image-wrapper">
                <img id="lightbox-img" src="" alt="Anı Fotoğrafı">
            </div>
            <div class="lightbox-info">
                <h3 id="lightbox-title" class="serif-title"></h3>
                <p id="lightbox-date" class="date-text"></p>
                <p id="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
